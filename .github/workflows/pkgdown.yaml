# Build the pkgdown site and deploy it to GitHub Pages via GitHub Actions.
# Replaces the legacy "Deploy from a branch" (gh-pages) build: the site is
# uploaded as a Pages artifact and served as-is, so GitHub's Jekyll builder
# never runs. That removes the auto-generated "pages build and deployment"
# workflow, its deployment_queued stalls, and the "Page build failed" errors.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

# Serialise deployments and drop superseded ones so bursts of pushes don't
# stack up behind each other the way the legacy builder did.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Enable Pages in "GitHub Actions" mode on the first run, migrating the
      # repo off the legacy branch build without a manual settings change.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: r-lib/actions/setup-pandoc@v2

      # Quarto is needed because the vignettes use the quarto engine.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
