# Lint the package with lintr on every push and PR. The .lintr config disables
# the linters that air (line width / wrapping), cli + glue interpolation, and
# explanatory section-header comments would otherwise trip; every other default
# linter stays on, and any lint fails the job.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'

name: lint.yaml

permissions: read-all

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
