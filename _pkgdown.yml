url: https://truenomad.github.io/polished/

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  includes:
    in_header: |
      <script>
        (function() {
          // light between 06:00 and 18:00 local time, dark otherwise
          var hour = new Date().getHours();
          var timeOfDay = (hour >= 6 && hour < 18) ? 'light' : 'dark';
          var ls;
          try { ls = window.localStorage; } catch (e) { ls = null; }
          var userSet = ls && ls.getItem('pkgdown-theme-source') === 'user';
          var stored = ls && ls.getItem('pkgdown-theme');
          var theme = (userSet && stored) ? stored : timeOfDay;
          if (ls && !userSet) ls.setItem('pkgdown-theme', timeOfDay);
          document.documentElement.dataset.bsTheme = theme;
          // any later change to data-bs-theme (via pkgdown's lightswitch)
          // is an explicit user choice, so remember it for next visit
          new MutationObserver(function() {
            var current = document.documentElement.dataset.bsTheme;
            if (!current || !ls) return;
            ls.setItem('pkgdown-theme', current);
            ls.setItem('pkgdown-theme-source', 'user');
          }).observe(document.documentElement, {
            attributes: true, attributeFilter: ['data-bs-theme']
          });
        })();
      </script>
  bslib:
    # palette drawn from the polished logo (deep navy badge) and the Global
    # Polio Eradication Initiative blue
    primary: "#15263F"
    secondary: "#628DA5"
    success: "#5BA86F"
    info: "#0094D4"
    warning: "#F2A900"
    danger: "#D8443C"
    link-color: "#0094D4"
    link-hover-color: "#1FA0DC"
    navbar-bg: "#15263F"
    navbar-fg: "#FFFFFF"
    headings-color: "#15263F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

navbar:
  bg: primary
  structure:
    left:  [intro, articles, reference, news]
    right: [search, lightswitch, github]

reference:
- title: Download POLIS data
  desc: >
    Download POLIS tables to a local cache. Downloads use Id-range pagination,
    resume from saved checkpoints and check for missing records.
  contents:
  - get_polis_data
  - polis_tables_mapping
- title: Configuration & pipeline
  desc: >
    Configure the cleaners and run them on tables in memory or raw files
    in a directory.
  contents:
  - polis_config
  - polis_active_config
  - print.polis_config
  - run_pipeline
  - run_pipeline_dir
- title: Clean the surveillance streams
  desc: >
    Standardise names, parse dates, derive variables, reconcile geography and
    remove duplicate records. `clean_virus()` combines positive records from
    the cleaned AFP and ES outputs.
  contents:
  - clean_afp
  - clean_human_spec
  - clean_es
  - clean_sia
  - clean_virus
- title: Population denominators
  desc: >
    Clean the raw POLIS population reference into adm0/adm1/adm2 under-5 /
    under-15 / all-ages denominators, optionally reconciled against WorldPop and
    rolled up via boundary-validity windows. These feed the rate indicators when
    no `population` is supplied to the pipeline directly.
  contents:
  - clean_pop
- title: Virus classification
  desc: >
    The shared decoder that turns the raw POLIS virus fields into the standard
    WPV / cVDPV / aVDPV / iVDPV vocabulary used across every stream.
  contents:
  - clean_afp_classification
  - clean_es_classification
- title: Clinical diagnosis
  desc: >
    Harmonise the four POLIS fields that carry the clinical cause of an AFP case
    into one canonical diagnosis, then derive the coarse class, the reported
    non-AFP flag and the follow-up outcome.
  contents:
  - clean_afp_diagnosis
- title: Reference tables
  desc: >
    Look up column mappings, raw and cleaned data definitions, country
    groupings and AFP diagnosis codes.
  contents:
  - polis_crosswalk
  - polis_dictionary
  - polis_country_lookup
  - polis_afp_diagnosis_lookup
  - polis_afp_icd10
  - polis_afp_diagnosis_class
- title: Recover & reconcile geography
  desc: >
    Fill missing administrative names and GUIDs from EPIDs, district boundaries
    or coordinates. Reconcile existing values against boundary references and
    standardise geographic names.
  contents:
  - impute_geo_from_epid
  - reconcile_admin_guids
  - impute_geo_from_coords
  - impute_missing_coords
  - fix_geo_names
  - polis_fix_geo_names
  - polis_geo_name_fixes
- title: Clean administrative spatial data
  desc: >
    Read WHO ADM0/ADM1/ADM2 boundary layers in formats supported by sf, standardise the
    names and repair the geometry, then write cleaned shapes plus a year-expanded
    long shape, with point-to-admin recovery.
  contents:
  - process_spatial
  - create_long_shape
  - get_admin_info_from_coords
- title: EPID building blocks
  desc: >
    Parse EPIDs, build reference tables from matching records and resolve
    country codes. These functions also support `impute_geo_from_epid()`.
  contents:
  - epid_split
  - epid_country_code
  - epid_prefix
  - epid_strip_contact
  - build_admin_ref
  - build_prefix_ref
  - resolve_epid_country
- title: Records, duplicates & types
  desc: >
    Standardise and order columns, keep the latest record per identifier,
    flag ambiguous business keys, remap synonyms, reconcile downloads and
    infer column types.
  contents:
  - standardise_names
  - order_columns
  - polis_upsert
  - collapse_business_key
  - flag_ambiguous
  - remap_synonyms
  - reconcile
  - auto_parse_types
  - detect_factors
- title: Indicators
  desc: >
    Compute the WHO POLIS surveillance indicator catalogue (NPAFP rate, stool
    adequacy, timeliness, dose history, environmental, virus, SIA and composite
    families) from cleaned case / ES / virus / SIA / lab tables. Call
    `available_indicators()` to browse the catalogue, optionally by `family`.
  contents:
  - calc_polio_indicators
  - available_indicators
- title: AFP case quality
  desc: >
    Timeliness of notification, investigation and stool collection, the stool
    specimen pathway and the reasons stools were inadequate, days from
    collection to laboratory receipt, and 60-day follow-up.
    `afp_stool_adequacy()` is the single stool adequacy classifier.
  contents:
  - calc_afp_timeliness
  - calc_afp_specimen_pathway
  - calc_afp_specimen_reasons
  - calc_afp_specimen_receipt_monthly
  - calc_afp_specimen_receipt_by_area
  - calc_afp_followup
  - afp_stool_adequacy
  - afp_stool_components
  - afp_specimen_receipt
  - afp_followup_status
- title: Pending classification
  desc: >
    Cases still awaiting classification by month of onset, placed on a ladder
    by the furthest laboratory stage their specimens reached.
  contents:
  - calc_pending_stage
  - afp_pending_open
  - afp_pending_dates
  - afp_specimen_rung
  - afp_pending_stage
- title: Environmental surveillance performance
  desc: >
    Sample resolution by month, and enterovirus and poliovirus shares and site
    regularity by district and by site over a reporting window.
  contents:
  - calc_es_resolution
  - calc_es_district_performance
  - calc_es_site_performance
  - es_reporting_window
  - es_complete_end
  - es_sample_state
- title: Detection windows
  desc: >
    Virus detections counted in comparison windows before a reporting date,
    and the direction between pairs of windows.
  contents:
  - calc_detection_windows
  - calc_detection_comparison
  - detection_direction
  - detection_slice
  - detection_default_windows
  - detection_default_pairs
- title: Environmental site scorecard
  desc: >
    Each active environmental site judged on its Sabin virus response after
    campaigns and on recovery of target virus found at nearby sites, with the
    network rates and the Sabin profile by weeks since a campaign.
  contents:
  - calc_es_scorecard
  - calc_es_score_network
  - calc_es_score_profile
  - es_score_settings
  - es_score_cols
- title: Synthetic data
  desc: >
    Invented geography, population, AFP cases, environmental samples, virus
    detections, stool specimens and campaign rounds, shaped like the cleaned
    tables, for testing and demonstrating indicator code without real records.
  contents:
  - simulate_polio_data
  - simulate_admin_frame
  - simulate_population
  - simulate_afp_cases
  - simulate_es_samples
  - simulate_detections
  - simulate_human_specimens
  - simulate_campaigns
- title: Data-quality checks
  desc: >
    Per-dataset checks that flag duplicates, blank keys, unreconciled GUIDs,
    out-of-range values and date-ordering problems straight from the cleaned
    tables, exported as a styled Excel workbook (one tab per check), plus the
    ES-specific quality helpers. `checks_pop()` documents the POLIS-vs-WorldPop
    population reconciliation instead.
  contents:
  - checks_afp
  - checks_es
  - checks_hum_spec
  - checks_sia
  - checks_virus
  - checks_pop
  - write_checks_excel
  - es_missingness
  - validate_es_sites
- title: Other surveillance processing
  desc: >
    Independent-monitoring (IM), LQAS campaign-monitoring, and SIA round-quality
    processors.
  contents:
  - process_im
  - process_lqas
  - process_sia_quality
- title: Project workspace
  desc: >
    Create project directories with `init_polis_project()`, or add a `.Rprofile`
    configuration and starter scripts with `init_polis_pipeline()`. Read
    processed outputs by country and year, and manage the project cache.
  contents:
  - init_polis_pipeline
  - init_polis_project
  - load_polished
  - project_path
  - clear_cache
  - print.polis_project

articles:
- title: Get started
