url: https://truenomad.github.io/polished/

template:
  bootstrap: 5

reference:
- title: Download POLIS data
  desc: >
    The download entry point and the table catalogue it fetches: a one-call pull
    that works around POLIS's pagination and date-filter quirks, with on-disk
    caching, resume, and post-download completeness verification.
  contents:
  - get_polis_data
  - polis_tables_mapping
- title: Impute geography from EPIDs
  desc: >
    The main entry point: a provenance-stamped cascade that fills missing admin
    names and GUIDs from EPIDs, without overwriting present values or
    fabricating on ambiguity.
  contents:
  - impute_geo_from_epid
- title: Building blocks
  desc: >
    The exported pieces the cascade is assembled from — parsers, the
    sibling-record lookups, and the country resolver. You rarely call these
    directly.
  contents:
  - epid_split
  - epid_country_code
  - epid_prefix
  - epid_strip_contact
  - build_admin_ref
  - build_prefix_ref
  - resolve_epid_country

articles:
- title: Get started
  navbar: ~
  contents:
  - downloading-polis-data
  - epid-geo-cleaning
