url: https://truenomad.github.io/polished/

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  includes:
    in_header: |
      <script>
        (function() {
          // light between 06:00 and 18:00 local time, dark otherwise
          var hour = new Date().getHours();
          var timeOfDay = (hour >= 6 && hour < 18) ? 'light' : 'dark';
          var ls;
          try { ls = window.localStorage; } catch (e) { ls = null; }
          var userSet = ls && ls.getItem('pkgdown-theme-source') === 'user';
          var stored = ls && ls.getItem('pkgdown-theme');
          var theme = (userSet && stored) ? stored : timeOfDay;
          if (ls && !userSet) ls.setItem('pkgdown-theme', timeOfDay);
          document.documentElement.dataset.bsTheme = theme;
          // any later change to data-bs-theme (via pkgdown's lightswitch)
          // is an explicit user choice, so remember it for next visit
          new MutationObserver(function() {
            var current = document.documentElement.dataset.bsTheme;
            if (!current || !ls) return;
            ls.setItem('pkgdown-theme', current);
            ls.setItem('pkgdown-theme-source', 'user');
          }).observe(document.documentElement, {
            attributes: true, attributeFilter: ['data-bs-theme']
          });
        })();
      </script>
  bslib:
    # palette drawn from the polished logo (deep navy badge) and the Global
    # Polio Eradication Initiative blue
    primary: "#15263F"
    secondary: "#628DA5"
    success: "#5BA86F"
    info: "#0094D4"
    warning: "#F2A900"
    danger: "#D8443C"
    link-color: "#0094D4"
    link-hover-color: "#1FA0DC"
    navbar-bg: "#15263F"
    navbar-fg: "#FFFFFF"
    headings-color: "#15263F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

navbar:
  bg: primary
  structure:
    left:  [intro, articles, reference, news]
    right: [search, lightswitch, github]

reference:
- title: Download POLIS data
  desc: >
    The download entry point and the table catalogue it fetches: a one-call pull
    that works around POLIS's pagination and date-filter quirks, with on-disk
    caching, resume, and post-download completeness verification.
  contents:
  - get_polis_data
  - polis_tables_mapping
- title: Configuration & pipeline
  desc: >
    The shared settings object every cleaner takes, and the orchestrators that
    run the whole cleaning set in one call (in memory, or from a directory of
    raw files).
  contents:
  - polis_config
  - polis_active_config
  - print.polis_config
  - run_pipeline
  - run_pipeline_dir
- title: Clean the surveillance streams
  desc: >
    One cleaner per POLIS stream. Each standardises names, sanitises dates,
    derives the analytic variables, cleans geography and dedups to one row per
    POLIS id. `clean_virus()` is the exception: it builds the positives dataset
    from the already-cleaned AFP and ES outputs.
  contents:
  - clean_afp
  - clean_human_spec
  - clean_es
  - clean_sia
  - clean_virus
- title: Population denominators
  desc: >
    Clean the raw POLIS population reference into adm0/adm1/adm2 under-5 /
    under-15 / all-ages denominators, optionally reconciled against WorldPop and
    rolled up via boundary-validity windows. These feed the rate indicators when
    no `population` is supplied to the pipeline directly.
  contents:
  - clean_pop
- title: Virus classification
  desc: >
    The shared decoder that turns the raw POLIS virus fields into the standard
    WPV / cVDPV / aVDPV / iVDPV vocabulary used across every stream.
  contents:
  - clean_afp_classification
  - clean_es_classification
- title: Clinical diagnosis
  desc: >
    Harmonise the four POLIS fields that carry the clinical cause of an AFP case
    into one canonical diagnosis, then derive the coarse class, the reported
    non-AFP flag and the follow-up outcome.
  contents:
  - clean_afp_diagnosis
- title: Reference tables
  desc: >
    The packaged lookups the cleaners are driven by: the raw-to-canonical column
    crosswalk, the data dictionary (raw or cleaned schema) it backs, the country
    grouping/risk reference, and the AFP diagnosis dictionaries.
  contents:
  - polis_crosswalk
  - polis_dictionary
  - polis_country_lookup
  - polis_afp_diagnosis_lookup
  - polis_afp_icd10
  - polis_afp_diagnosis_class
- title: Recover & reconcile geography
  desc: >
    Fill missing admin names and GUIDs without overwriting present values or
    fabricating on ambiguity (from EPIDs, from a district shape, or from
    coordinates), plus the admin-name fixers.
  contents:
  - impute_geo_from_epid
  - reconcile_admin_guids
  - impute_geo_from_coords
  - impute_missing_coords
  - fix_geo_names
  - polis_fix_geo_names
  - polis_geo_name_fixes
- title: Clean administrative spatial data
  desc: >
    Read WHO ADM0/ADM1/ADM2 boundary layers from any format, standardise the
    names and repair the geometry, then write cleaned shapes plus a year-expanded
    long shape, with point-to-admin recovery.
  contents:
  - process_spatial
  - create_long_shape
  - get_admin_info_from_coords
- title: EPID building blocks
  desc: >
    The exported pieces the EPID-geography cascade is assembled from: parsers,
    the sibling-record lookups, and the country resolver. You rarely call these
    directly.
  contents:
  - epid_split
  - epid_country_code
  - epid_prefix
  - epid_strip_contact
  - build_admin_ref
  - build_prefix_ref
  - resolve_epid_country
- title: Records, dedup & types
  desc: >
    The shared primitives the cleaners compose from: column standardisation and
    ordering, keep-latest dedup, the business-key tripwire, synonym remapping,
    full-pull reconcile, and column type inference.
  contents:
  - standardise_names
  - order_columns
  - polis_upsert
  - collapse_business_key
  - flag_ambiguous
  - remap_synonyms
  - reconcile
  - auto_parse_types
  - detect_factors
- title: Indicators
  desc: >
    Compute the WHO POLIS surveillance indicator catalogue (NPAFP rate, stool
    adequacy, timeliness, dose history, environmental, virus, SIA and composite
    families) from cleaned case / ES / virus / SIA / lab tables. Call
    `available_indicators()` to browse the catalogue, optionally by `family`.
  contents:
  - calc_polio_indicators
  - available_indicators
- title: Data-quality checks
  desc: >
    Per-dataset checks that flag duplicates, blank keys, unreconciled GUIDs,
    out-of-range values and date-ordering problems straight from the cleaned
    tables, exported as a styled Excel workbook (one tab per check), plus the
    ES-specific quality helpers. `checks_pop()` documents the POLIS-vs-WorldPop
    population reconciliation instead.
  contents:
  - checks_afp
  - checks_es
  - checks_hum_spec
  - checks_sia
  - checks_virus
  - checks_pop
  - write_checks_excel
  - es_missingness
  - validate_es_sites
- title: Other surveillance processing
  desc: >
    Independent-monitoring (IM), LQAS campaign-monitoring, and SIA round-quality
    processors.
  contents:
  - process_im
  - process_lqas
  - process_sia_quality
- title: Project workspace
  desc: >
    Scaffold a project on disk — either the full domain-numbered pipeline
    (`init_polis_pipeline()`, with a wired `.Rprofile` and download/process
    scripts) or the lighter generic zones (`init_polis_project()`) — stream the
    cleaning pipeline into it, and read partitioned slices back out.
  contents:
  - init_polis_pipeline
  - init_polis_project
  - load_polished
  - project_path
  - clear_cache
  - print.polis_project

articles:
- title: Get started
